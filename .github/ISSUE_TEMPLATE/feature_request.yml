name: Feature Request
description: Suggest a new feature or improvement
labels: [enhancement]
body:
    - type: textarea
      id: description
      attributes:
          label: Description
          description: A clear description of the feature or improvement you'd like.
      validations:
          required: true

    - type: textarea
      id: use-case
      attributes:
          label: Use Case
          description: Why is this feature needed? What problem does it solve?
      validations:
          required: true

    - type: textarea
      id: proposed-solution
      attributes:
          label: Proposed Solution
          description: How you envision this working.
      validations:
          required: false

    - type: textarea
      id: alternatives
      attributes:
          label: Alternatives Considered
          description: Any alternative solutions or features you've considered.
      validations:
          required: false

    - type: textarea
      id: context
      attributes:
          label: Additional Context
          description: Any other relevant information, mockups or references.
      validations:
          required: false
