name: Bug Report
description: Report a bug or unexpected behavior
labels: [bug]
body:
    - type: textarea
      id: description
      attributes:
          label: Description
          description: A clear description of what the bug is.
      validations:
          required: true

    - type: textarea
      id: steps
      attributes:
          label: Steps to Reproduce
          description: Steps to reproduce the behavior.
          placeholder: |
              1. Open the application
              2. Navigate to '...'
              3. Click on '...'
              4. See error
      validations:
          required: true

    - type: textarea
      id: expected
      attributes:
          label: Expected Behavior
          description: What you expected to happen.
      validations:
          required: true

    - type: textarea
      id: actual
      attributes:
          label: Actual Behavior
          description: What actually happened.
      validations:
          required: true

    - type: input
      id: version
      attributes:
          label: LocalTelemetry Version
          description: "The version you are using (e.g., v1.0.0-beta.1). Check Settings > About."
          placeholder: v1.0.0-beta.1
      validations:
          required: true

    - type: dropdown
      id: windows-version
      attributes:
          label: Windows Version
          options:
              - Windows 11 24H2
              - Windows 11 23H2
              - Windows 11 22H2
              - Windows 10 22H2
              - Other (specify in Additional Context)
      validations:
          required: true

    - type: input
      id: gpu
      attributes:
          label: GPU Model
          placeholder: "e.g., NVIDIA RTX 4070, AMD RX 7800 XT, Intel Arc A770"
      validations:
          required: false

    - type: textarea
      id: screenshots
      attributes:
          label: Screenshots
          description: If applicable, add screenshots to help explain the problem.
      validations:
          required: false

    - type: textarea
      id: context
      attributes:
          label: Additional Context
          description: Any other relevant information (logs, crash dumps, etc.)
      validations:
          required: false
