# GitHub Dependabot Configuration
# Reference: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot-version-update-file
version: 2
updates:
    # 1. .NET / C# NuGet Dependencies
    - package-ecosystem: "nuget"
      directory: "/"
      schedule:
          interval: "monthly"
          day: "monday"
          time: "06:00"
          timezone: "Asia/Kolkata" # GMT+5:30
      open-pull-requests-limit: 5
      rebase-strategy: "auto"
      commit-message:
          prefix: "build(deps)"
          prefix-development: "build(deps-dev)"
      labels:
          - "dependencies"
          - "dependabot"
          - "csharp"
      ignore:
          - dependency-name: "*"
            update-types: ["version-update:semver-patch"]
          - dependency-name: "Xunit.StaFact"
            update-types: ["version-update:semver-major"]
      groups:
          dotnet-deps:
              patterns:
                  - "*"

    # 2. .NET SDK Version (global.json)
    - package-ecosystem: "dotnet-sdk"
      directory: "/"
      schedule:
          interval: "monthly"
          day: "monday"
          time: "06:00"
          timezone: "Asia/Kolkata" # GMT+5:30
      open-pull-requests-limit: 5
      rebase-strategy: "auto"
      commit-message:
          prefix: "build(deps)"
      labels:
          - "dependencies"
          - "dependabot"
          - "scope:ci"
      ignore:
          - dependency-name: "*"
            update-types: ["version-update:semver-patch"]
      groups:
          sdk-deps:
              patterns:
                  - "*"

    # 3. Svelte 5 / Vite Frontend Dependencies (Bun)
    - package-ecosystem: "bun"
      directory: "/src/LocalTelemetry.App/Settings/wwwroot"
      schedule:
          interval: "monthly"
          day: "monday"
          time: "06:00"
          timezone: "Asia/Kolkata" # GMT+5:30
      open-pull-requests-limit: 5
      rebase-strategy: "auto"
      commit-message:
          prefix: "build(deps)"
          prefix-development: "build(deps-dev)"
      labels:
          - "dependencies"
          - "dependabot"
          - "frontend"
      ignore:
          - dependency-name: "*"
            update-types: ["version-update:semver-patch"]
      groups:
          frontend-deps:
              patterns:
                  - "*"

    # 4. Svelte 5 / Vite Test Frontend Dependencies (Bun)
    - package-ecosystem: "bun"
      directory: "/tests/LocalTelemetry.App.Tests/Settings/wwwroot"
      schedule:
          interval: "monthly"
          day: "monday"
          time: "06:00"
          timezone: "Asia/Kolkata" # GMT+5:30
      open-pull-requests-limit: 5
      rebase-strategy: "auto"
      commit-message:
          prefix: "build(deps)"
          prefix-development: "build(deps-dev)"
      labels:
          - "dependencies"
          - "dependabot"
          - "frontend"
      ignore:
          - dependency-name: "*"
            update-types: ["version-update:semver-patch"]
      groups:
          frontend-deps:
              patterns:
                  - "*"

    # 5. Documentation Site Dependencies (Bun)
    - package-ecosystem: "bun"
      directory: "/docs"
      schedule:
          interval: "monthly"
          day: "monday"
          time: "06:00"
          timezone: "Asia/Kolkata" # GMT+5:30
      open-pull-requests-limit: 5
      rebase-strategy: "auto"
      commit-message:
          prefix: "build(deps)"
          prefix-development: "build(deps-dev)"
      labels:
          - "dependencies"
          - "dependabot"
          - "documentation"
      ignore:
          - dependency-name: "*"
            update-types: ["version-update:semver-patch"]
      groups:
          docs-deps:
              patterns:
                  - "*"

    # 6. Release Automation Dependencies (Bun)
    - package-ecosystem: "bun"
      directory: "/.github/release"
      schedule:
          interval: "monthly"
          day: "monday"
          time: "06:00"
          timezone: "Asia/Kolkata" # GMT+5:30
      open-pull-requests-limit: 5
      rebase-strategy: "auto"
      commit-message:
          prefix: "ci(deps)"
          prefix-development: "ci(deps-dev)"
      labels:
          - "dependencies"
          - "dependabot"
          - "scope:ci"
      ignore:
          - dependency-name: "*"
            update-types: ["version-update:semver-patch"]
      groups:
          release-deps:
              patterns:
                  - "*"

    # 7. Discord Webhook Dependencies (Bun)
    - package-ecosystem: "bun"
      directory: "/.discord"
      schedule:
          interval: "monthly"
          day: "monday"
          time: "06:00"
          timezone: "Asia/Kolkata" # GMT+5:30
      open-pull-requests-limit: 5
      rebase-strategy: "auto"
      commit-message:
          prefix: "ci(deps)"
          prefix-development: "ci(deps-dev)"
      labels:
          - "dependencies"
          - "dependabot"
          - "scope:ci"
      ignore:
          - dependency-name: "*"
            update-types: ["version-update:semver-patch"]
      groups:
          discord-deps:
              patterns:
                  - "*"

    # 8. GitHub Actions Workflows (.github/workflows/*.yml)
    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
          interval: "monthly"
          day: "monday"
          time: "06:00"
          timezone: "Asia/Kolkata" # GMT+5:30
      open-pull-requests-limit: 5
      rebase-strategy: "auto"
      commit-message:
          prefix: "ci(deps)"
      labels:
          - "dependabot"
          - "actions"
          - "scope:ci"
      ignore:
          - dependency-name: "*"
            update-types: ["version-update:semver-patch"]
      groups:
          actions-deps:
              patterns:
                  - "*"
