name: CI

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]

permissions:
    contents: read

jobs:
    commitlint:
        name: Commit Lint
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0

            - name: Install Dependencies
              run: npm install --no-save --no-package-lock --ignore-scripts commitlint-plugin-function-rules@4.0.1 @commitlint/config-conventional@19.8.0

            - name: Verify Commits
              uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1
              with:
                  configFile: commitlint.config.mjs

    test-frontend:
        name: Frontend Tests
        needs: [commitlint]
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

            - name: Run Vitest
              run: |
                  bun install --frozen-lockfile --ignore-scripts
                  bun run test:coverage
              working-directory: tests/LocalTelemetry.App.Tests/Settings/wwwroot

            - name: Upload Frontend Coverage
              uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  slug: Nicconike/LocalTelemetry
                  files: tests/LocalTelemetry.App.Tests/Settings/wwwroot/coverage/cobertura-coverage.xml
                  flags: app
                  disable_search: true

    test-windows:
        name: .NET Tests
        needs: [commitlint]
        runs-on: windows-latest
        env:
            DOTNET_CLI_TELEMETRY_OPTOUT: "1"
            DOTNET_NOLOGO: "true"
        steps:
            - name: Checkout Repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0

            - name: Setup Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

            - name: Build Frontend
              run: |
                  bun install --frozen-lockfile --ignore-scripts
                  bun run build
              working-directory: src/LocalTelemetry.App/Settings/wwwroot

            - name: Cache NuGet
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.nuget/packages
                  key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
                  restore-keys: ${{ runner.os }}-nuget-

            - name: Setup .NET
              uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
              with:
                  dotnet-version: 10.0.x

            - name: Format Check
              run: dotnet format --verify-no-changes

            - name: Build Solution
              run: dotnet build --configuration Debug

            - name: Test Core
              run: dotnet test tests/LocalTelemetry.Core.Tests/LocalTelemetry.Core.Tests.csproj --configuration Debug --no-build --verbosity minimal --collect:"XPlat Code Coverage" --results-directory TestResults/core -p:Platform=x64

            - name: Test Notifier
              run: dotnet test tests/LocalTelemetry.Notifier.Tests/LocalTelemetry.Notifier.Tests.csproj --configuration Debug --no-build --verbosity minimal --collect:"XPlat Code Coverage" --results-directory TestResults/notifier -p:Platform=x64

            - name: Test App
              run: dotnet test tests/LocalTelemetry.App.Tests/LocalTelemetry.App.Tests.csproj --configuration Debug --no-build --verbosity minimal --collect:"XPlat Code Coverage" --results-directory TestResults/app -p:Platform=x64

            - name: Upload Core Coverage
              uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  slug: Nicconike/LocalTelemetry
                  files: TestResults/core/**/coverage.cobertura.xml
                  flags: core
                  disable_search: true

            - name: Upload Notifier Coverage
              uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  slug: Nicconike/LocalTelemetry
                  files: TestResults/notifier/**/coverage.cobertura.xml
                  flags: notifier
                  disable_search: true

            - name: Upload App Coverage
              uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  slug: Nicconike/LocalTelemetry
                  files: TestResults/app/**/coverage.cobertura.xml
                  flags: app
                  disable_search: true

    ci:
        name: CI
        needs: [commitlint, test-frontend, test-windows]
        if: always()
        runs-on: ubuntu-latest
        steps:
            - name: Check Status
              run: |
                  if [ "${{ needs.commitlint.result }}" != "success" ] || \
                     [ "${{ needs.test-frontend.result }}" != "success" ] || \
                     [ "${{ needs.test-windows.result }}" != "success" ]; then
                      echo "One or more CI jobs failed."
                      exit 1
                  fi
                  echo "All CI jobs completed successfully."
