name: Sync PRs

on:
    push:
        branches: [master]
    pull_request_target:
        types: [opened, synchronize, reopened]
    workflow_run:
        workflows: ["CI"]
        types: [completed]

permissions:
    contents: read
    pull-requests: write
    issues: write

jobs:
    sync:
        name: Sync & Merge
        runs-on: ubuntu-latest
        steps:
            - name: Generate App Token
              id: app_token
              uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
              with:
                  client-id: ${{ secrets.APP_CLIENT_ID }}
                  private-key: ${{ secrets.APP_PRIVATE_KEY }}

            - name: Sync Open PRs on Push
              if: github.event_name == 'push'
              env:
                  GH_TOKEN: ${{ steps.app_token.outputs.token }}
                  REPO: ${{ github.repository }}
              run: |
                  prs=$(gh pr list --repo "$REPO" --state open --json number,headRefName,author,title --jq '.[]')
                  if [ -z "$prs" ]; then
                      echo "No open pull requests found."
                      exit 0
                  fi

                  echo "$prs" | jq -c '.' | while read -r pr; do
                      pr_num=$(echo "$pr" | jq -r '.number')
                      pr_author=$(echo "$pr" | jq -r '.author.login')
                      pr_branch=$(echo "$pr" | jq -r '.headRefName')
                      pr_title=$(echo "$pr" | jq -r '.title')

                      echo "Processing PR #$pr_num (branch: $pr_branch, author: $pr_author)..."

                      echo "Updating branch for PR #$pr_num..."
                      gh api --method PUT "repos/$REPO/pulls/$pr_num/update-branch" --silent || true

                      clean_title="${pr_title%% in /*}"
                      clean_title="${clean_title%% in the * group}"
                      clean_title=$(echo "$clean_title" | sed -E 's/ across [0-9]+ director(y|ies)//')

                      if [ "$clean_title" != "$pr_title" ]; then
                          echo "Updating PR #$pr_num title to '$clean_title'..."
                          gh pr edit "$pr_num" --repo "$REPO" --title "$clean_title" || true
                      fi

                      gh pr merge "$pr_num" --repo "$REPO" --squash --admin --subject "$clean_title" --body "" || \
                      gh pr merge "$pr_num" --repo "$REPO" --auto --squash --subject "$clean_title" --body "" || true
                  done

            - name: Configure Auto-Merge on PR Event
              if: github.event_name == 'pull_request_target'
              env:
                  GH_TOKEN: ${{ steps.app_token.outputs.token }}
                  REPO: ${{ github.repository }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
                  PR_AUTHOR: ${{ github.event.pull_request.user.login }}
                  PR_TITLE: ${{ github.event.pull_request.title }}
              run: |
                  echo "Configuring auto-merge for PR #$PR_NUMBER (author: $PR_AUTHOR)"
                  clean_title="${PR_TITLE%% in /*}"
                  clean_title="${clean_title%% in the * group}"
                  clean_title=$(echo "$clean_title" | sed -E 's/ across [0-9]+ director(y|ies)//')

                  if [ "$clean_title" != "$PR_TITLE" ]; then
                      echo "Updating PR #$PR_NUMBER title to '$clean_title'..."
                      gh pr edit "$PR_NUMBER" --repo "$REPO" --title "$clean_title" || true
                  fi

                  gh pr merge "$PR_NUMBER" --repo "$REPO" --auto --squash --subject "$clean_title" --body "" || true

            - name: Auto-Merge Passing PR on CI Completion
              if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
              env:
                  GH_TOKEN: ${{ steps.app_token.outputs.token }}
                  REPO: ${{ github.repository }}
              run: |
                  pr_number="${{ github.event.workflow_run.pull_requests[0].number }}"
                  if [ -n "$pr_number" ] && [ "$pr_number" != "null" ]; then
                      echo "CI completed successfully for PR #$pr_number"
                      pr_title=$(gh pr view "$pr_number" --repo "$REPO" --json title --jq '.title')
                      clean_title="${pr_title%% in /*}"
                      clean_title="${clean_title%% in the * group}"
                      clean_title=$(echo "$clean_title" | sed -E 's/ across [0-9]+ director(y|ies)//')

                      if [ "$clean_title" != "$pr_title" ]; then
                          echo "Updating PR #$pr_number title to '$clean_title'..."
                          gh pr edit "$pr_number" --repo "$REPO" --title "$clean_title" || true
                      fi

                      gh pr merge "$pr_number" --repo "$REPO" --squash --admin --subject "$clean_title" --body "" || true
                  fi
