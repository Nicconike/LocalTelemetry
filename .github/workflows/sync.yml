name: Sync PRs

on:
    push:
        branches: [master]
    pull_request_target:
        types: [opened, synchronize, reopened]
    workflow_run:
        workflows: ["CI", "SonarQube Analysis", "CodeQL"]
        types: [completed]

permissions:
    contents: read
    pull-requests: write
    issues: write

jobs:
    sync:
        name: Sync & Merge
        runs-on: ubuntu-latest
        steps:
            - name: Generate App Token
              id: app_token
              uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
              with:
                  client-id: ${{ secrets.APP_CLIENT_ID }}
                  private-key: ${{ secrets.APP_PRIVATE_KEY }}

            - name: Sync Open PRs on Push
              if: github.event_name == 'push'
              env:
                  GH_TOKEN: ${{ secrets.PROJECTS || steps.app_token.outputs.token || secrets.GITHUB_TOKEN }}
                  REPO: ${{ github.repository }}
              run: |
                  prs=$(gh pr list --repo "$REPO" --state open --json number,headRefName,author,title --jq '.[]')
                  if [ -z "$prs" ]; then
                      echo "No open pull requests found."
                      exit 0
                  fi

                  echo "$prs" | jq -c '.' | while read -r pr; do
                      pr_num=$(echo "$pr" | jq -r '.number')
                      pr_author=$(echo "$pr" | jq -r '.author.login')
                      pr_branch=$(echo "$pr" | jq -r '.headRefName')
                      pr_title=$(echo "$pr" | jq -r '.title')

                      echo "Processing PR #$pr_num (branch: $pr_branch, author: $pr_author)..."

                      if [ "$pr_author" = "app/dependabot" ] || [ "$pr_author" = "dependabot" ] || [ "$pr_author" = "dependabot[bot]" ]; then
                          echo "Triggering Dependabot rebase for PR #$pr_num..."
                          gh pr comment "$pr_num" --repo "$REPO" --body "@dependabot rebase" || true
                      else
                          echo "Updating branch for PR #$pr_num..."
                          gh api --method PUT "repos/$REPO/pulls/$pr_num/update-branch" --silent || true
                      fi

                      clean_title="$pr_title"
                      if [[ "$clean_title" =~ ^([a-zA-Z0-9_()-]+:\ )([Bb]ump the ([a-zA-Z0-9_-]+)-deps group.*)$ ]]; then
                          clean_title="${BASH_REMATCH[1]}bump ${BASH_REMATCH[3]} dependencies"
                      else
                          clean_title=$(echo "$clean_title" | sed -E 's/ in \/[^ ]+//g')
                          clean_title=$(echo "$clean_title" | sed -E 's/ in the [^ ]+ group//g')
                          clean_title=$(echo "$clean_title" | sed -E 's/ across [0-9]+ (directories|directory)//g')
                          clean_title=$(echo "$clean_title" | sed -E 's/ with [0-9]+ updates?//g')
                      fi

                      if [ "$clean_title" != "$pr_title" ]; then
                          echo "Updating PR #$pr_num title to '$clean_title'..."
                          gh api --method PATCH "repos/$REPO/pulls/$pr_num" -f title="$clean_title" || true
                      fi
                  done

            - name: Configure PR on Event
              if: github.event_name == 'pull_request_target'
              env:
                  GH_TOKEN: ${{ secrets.PROJECTS || steps.app_token.outputs.token || secrets.GITHUB_TOKEN }}
                  REPO: ${{ github.repository }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
                  PR_TITLE: ${{ github.event.pull_request.title }}
              run: |
                  echo "Configuring PR #$PR_NUMBER..."
                  clean_title="$PR_TITLE"
                  if [[ "$clean_title" =~ ^([a-zA-Z0-9_()-]+:\ )([Bb]ump the ([a-zA-Z0-9_-]+)-deps group.*)$ ]]; then
                      clean_title="${BASH_REMATCH[1]}bump ${BASH_REMATCH[3]} dependencies"
                  else
                      clean_title=$(echo "$clean_title" | sed -E 's/ in \/[^ ]+//g')
                      clean_title=$(echo "$clean_title" | sed -E 's/ in the [^ ]+ group//g')
                      clean_title=$(echo "$clean_title" | sed -E 's/ across [0-9]+ (directories|directory)//g')
                      clean_title=$(echo "$clean_title" | sed -E 's/ with [0-9]+ updates?//g')
                  fi

                  if [ "$clean_title" != "$PR_TITLE" ]; then
                      echo "Updating PR #$PR_NUMBER title to '$clean_title'..."
                      gh api --method PATCH "repos/$REPO/pulls/$PR_NUMBER" -f title="$clean_title" || true
                  fi

                  echo "Enabling auto-merge for PR #$PR_NUMBER (requires owner approval and passing checks)..."
                  gh pr merge "$PR_NUMBER" --repo "$REPO" --auto --squash --subject "$clean_title" --body "" || true

            - name: Verify and Merge Passing PR on Workflow Completion
              if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
              env:
                  GH_TOKEN: ${{ secrets.PROJECTS || steps.app_token.outputs.token || secrets.GITHUB_TOKEN }}
                  REPO: ${{ github.repository }}
              run: |
                  pr_number="${{ github.event.workflow_run.pull_requests[0].number }}"
                  if [ -z "$pr_number" ] || [ "$pr_number" = "null" ]; then
                      echo "No associated pull request found for this workflow run."
                      exit 0
                  fi

                  echo "Workflow completed successfully for PR #$pr_number."

                  pr_state=$(gh pr view "$pr_number" --repo "$REPO" --json state --jq '.state')
                  if [ "$pr_state" != "OPEN" ]; then
                      echo "PR #$pr_number is not open (state: $pr_state). Skipping."
                      exit 0
                  fi

                  echo "Checking required status checks for PR #$pr_number..."
                  if ! gh pr checks "$pr_number" --repo "$REPO" --required; then
                      echo "Required status checks for PR #$pr_number are still pending or failed. Will not merge."
                      exit 0
                  fi

                  echo "All required checks passed for PR #$pr_number!"
                  pr_title=$(gh pr view "$pr_number" --repo "$REPO" --json title --jq '.title')
                  clean_title="$pr_title"
                  if [[ "$clean_title" =~ ^([a-zA-Z0-9_()-]+:\ )([Bb]ump the ([a-zA-Z0-9_-]+)-deps group.*)$ ]]; then
                      clean_title="${BASH_REMATCH[1]}bump ${BASH_REMATCH[3]} dependencies"
                  else
                      clean_title=$(echo "$clean_title" | sed -E 's/ in \/[^ ]+//g')
                      clean_title=$(echo "$clean_title" | sed -E 's/ in the [^ ]+ group//g')
                      clean_title=$(echo "$clean_title" | sed -E 's/ across [0-9]+ (directories|directory)//g')
                      clean_title=$(echo "$clean_title" | sed -E 's/ with [0-9]+ updates?//g')
                  fi

                  if [ "$clean_title" != "$pr_title" ]; then
                      echo "Updating PR #$pr_number title to '$clean_title'..."
                      gh api --method PATCH "repos/$REPO/pulls/$pr_number" -f title="$clean_title" || true
                  fi

                  echo "Checking if PR #$pr_number has required code owner approval..."
                  review_decision=$(gh pr view "$pr_number" --repo "$REPO" --json reviewDecision --jq '.reviewDecision')
                  if [ "$review_decision" != "APPROVED" ]; then
                      echo "PR #$pr_number is not approved yet (reviewDecision: $review_decision). Waiting for code owner review."
                      exit 0
                  fi

                  echo "Merging approved and verified PR #$pr_number..."
                  gh pr merge "$pr_number" --repo "$REPO" --squash --subject "$clean_title" --body "" || true
