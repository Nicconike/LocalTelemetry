name: SonarQube Analysis

on:
    push:
        branches: [master, develop]
        paths:
            - "src/**"
            - "tests/**"
            - "Directory.Build.props"
            - "global.json"
            - "LocalTelemetry.sln"
            - ".github/workflows/sonar.yml"
    pull_request:
        types: [opened, synchronize, reopened]
        paths:
            - "src/**"
            - "tests/**"
            - "Directory.Build.props"
            - "global.json"
            - "LocalTelemetry.sln"
            - ".github/workflows/sonar.yml"

permissions:
    contents: read

jobs:
    analyze:
        name: SonarQube Analysis
        runs-on: windows-latest
        env:
            DOTNET_CLI_TELEMETRY_OPTOUT: "1"
            DOTNET_NOLOGO: "true"
        steps:
            - name: Checkout Repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0

            - name: Setup Java
              uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
              with:
                  java-version: 21
                  distribution: "zulu"

            - name: Setup .NET
              uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
              with:
                  dotnet-version: "10.0.x"

            - name: Setup Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

            - name: Cache Tools & NuGet
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      ~/.sonar/cache
                      ~/.dotnet/tools
                      ~/.nuget/packages
                  key: ${{ runner.os }}-sonar-v1-${{ hashFiles('**/*.csproj') }}
                  restore-keys: |
                      ${{ runner.os }}-sonar-v1-
                      ${{ runner.os }}-sonar-

            - name: Build Frontend
              run: |
                  bun install --frozen-lockfile --ignore-scripts
                  bun run build
              working-directory: src/LocalTelemetry.App/Settings/wwwroot

            - name: Install SonarScanner
              shell: pwsh
              run: dotnet tool update --global dotnet-sonarscanner

            - name: Run Analysis
              shell: pwsh
              env:
                  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
              run: |
                  $ErrorActionPreference = "Stop"
                  $PSNativeCommandUseErrorActionPreference = $true

                  dotnet-sonarscanner begin `
                      /k:"LocalTelemetry" `
                      /o:"nicconike" `
                      /d:sonar.host.url="https://sonarcloud.io" `
                      /d:sonar.token="$env:SONAR_TOKEN" `
                      /d:sonar.cs.cobertura.reportsPaths="**/TestResults/**/coverage.cobertura.xml" `
                      /d:sonar.scanner.scanAll=false `
                      /d:sonar.exclusions="**/wwwroot/dist/**,**/bin/**,**/obj/**"

                  dotnet build --configuration Debug

                  dotnet test --configuration Debug --no-build --verbosity minimal --collect:"XPlat Code Coverage" --results-directory TestResults -p:Platform=x64

                  dotnet-sonarscanner end /d:sonar.token="$env:SONAR_TOKEN"
