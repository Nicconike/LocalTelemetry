name: Project Automation

on:
    issues:
        types: [opened, closed, reopened, assigned, unassigned]
    pull_request_target:
        types:
            [
                opened,
                synchronize,
                reopened,
                closed,
                ready_for_review,
                converted_to_draft,
                review_requested,
            ]
    workflow_dispatch:

permissions:
    contents: read

jobs:
    auto-project-setup:
        name: Auto Project Setup
        runs-on: ubuntu-latest
        permissions:
            issues: write
            pull-requests: write

        steps:
            - name: Configure Item
              uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
              env:
                  PROJECTS: ${{ secrets.PROJECTS }}
              with:
                  github-token: ${{ secrets.PROJECTS }}
                  script: |
                      const action = context.payload.action;
                      const isIssue = !!context.payload.issue;
                      const item = isIssue ? context.payload.issue : context.payload.pull_request;
                      const owner = context.repo.owner;
                      const projectNumber = 7;
                      const graphqlWithPat = github.graphql;

                      // 1. Fetch Project #7 and Field Schema
                      const projectQuery = `
                          query($owner: String!, $number: Int!) {
                              user(login: $owner) {
                                  projectV2(number: $number) {
                                      id
                                      fields(first: 100) {
                                          nodes {
                                              ... on ProjectV2IterationField {
                                                  id
                                                  name
                                                  configuration {
                                                      iterations {
                                                          id
                                                          startDate
                                                          duration
                                                      }
                                                  }
                                              }
                                              ... on ProjectV2SingleSelectField {
                                                  id
                                                  name
                                                  options {
                                                      id
                                                      name
                                                  }
                                              }
                                              ... on ProjectV2Field {
                                                  id
                                                  name
                                                  dataType
                                              }
                                          }
                                      }
                                  }
                              }
                          }
                      `;

                      let project, projectId, allFields;
                      try {
                          const projectData = await graphqlWithPat(projectQuery, { owner, number: projectNumber });
                          project = projectData.user ? projectData.user.projectV2 : null;
                          if (!project) {
                              core.setFailed(`Project #${projectNumber} not found under user '${owner}'. Ensure PROJECTS secret is configured.`);
                              return;
                          }
                          projectId = project.id;
                          allFields = project.fields.nodes;
                      } catch (err) {
                          core.setFailed(`Project fetch failed: ${err.message}`);
                          return;
                      }

                      // Fetch Repository Issue Types
                      let availableIssueTypes = [];
                      try {
                          const repoQuery = `
                              query($owner: String!, $repo: String!) {
                                  repository(owner: $owner, name: $repo) {
                                      issueTypes(first: 10) {
                                          nodes { id name }
                                      }
                                  }
                              }
                          `;
                          const repoData = await graphqlWithPat(repoQuery, { owner, repo: context.repo.repo });
                          availableIssueTypes = repoData.repository?.issueTypes?.nodes || [];
                      } catch (err) {
                          console.warn(`Issue types fetch skipped: ${err.message}`);
                      }

                      // Helper: Update Native GitHub Issue Type
                      const updateNativeIssueType = async (issueId, targetTypeName) => {
                          if (!issueId || !targetTypeName || availableIssueTypes.length === 0) return;
                          const matchedType = availableIssueTypes.find(t => t.name.toLowerCase() === targetTypeName.toLowerCase());
                          if (matchedType) {
                              try {
                                  const mutation = `
                                      mutation($issueId: ID!, $issueTypeId: ID!) {
                                          updateIssue(input: { id: $issueId, issueTypeId: $issueTypeId }) {
                                              issue { id issueType { name } }
                                          }
                                      }
                                  `;
                                  await graphqlWithPat(mutation, { issueId, issueTypeId: matchedType.id });
                                  console.log(`Updated issue ${issueId} -> native issueType: ${matchedType.name}`);
                              } catch (err) {
                                  console.warn(`Native issueType update skipped: ${err.message}`);
                              }
                          }
                      };

                      // Helper: Update Single-Select Field (Status, Priority, Scope, Kind)
                      const updateSingleSelectField = async (targetItemId, fieldName, targetOptionName) => {
                          const field = allFields.find(f => f.name && f.name.toLowerCase() === fieldName.toLowerCase());
                          if (field && field.options && targetOptionName) {
                              const matchedOption = field.options.find(opt =>
                                  opt.name.toLowerCase() === targetOptionName.toLowerCase() ||
                                  opt.name.toLowerCase().includes(targetOptionName.toLowerCase()) ||
                                  targetOptionName.toLowerCase().includes(opt.name.toLowerCase())
                              );
                              if (matchedOption) {
                                  const updateMutation = `
                                      mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                                          updateProjectV2ItemFieldValue(input: {
                                              projectId: $projectId,
                                              itemId: $itemId,
                                              fieldId: $fieldId,
                                              value: { singleSelectOptionId: $optionId }
                                          }) {
                                              projectV2Item { id }
                                          }
                                      }
                                  `;
                                  await graphqlWithPat(updateMutation, {
                                      projectId,
                                      itemId: targetItemId,
                                      fieldId: field.id,
                                      optionId: matchedOption.id
                                  });
                                  console.log(`Updated item ${targetItemId} -> ${fieldName}: ${matchedOption.name}`);
                              }
                          }
                      };

                      // Helper: Update Number Field (Effort)
                      const updateNumberField = async (targetItemId, fieldName, numValue) => {
                          const field = allFields.find(f => f.name && f.name.toLowerCase() === fieldName.toLowerCase());
                          if (field && field.id && numValue !== undefined) {
                              const updateMutation = `
                                  mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $numValue: Float!) {
                                      updateProjectV2ItemFieldValue(input: {
                                          projectId: $projectId,
                                          itemId: $itemId,
                                          fieldId: $fieldId,
                                          value: { number: $numValue }
                                      }) {
                                          projectV2Item { id }
                                      }
                                  }
                              `;
                              await graphqlWithPat(updateMutation, {
                                  projectId,
                                  itemId: targetItemId,
                                  fieldId: field.id,
                                  numValue: parseFloat(numValue)
                              });
                              console.log(`Updated item ${targetItemId} -> ${fieldName}: ${numValue}`);
                          }
                      };

                      // Helper: Update Sprint Iteration
                      const updateSprintField = async (targetItemId) => {
                          const iterationField = allFields.find(f => f.configuration && f.configuration.iterations);
                          if (iterationField) {
                              const todayStr = new Date().toISOString().split('T')[0];
                              const iterations = iterationField.configuration.iterations;
                              let activeIteration = iterations.find(iter => {
                                  const startStr = iter.startDate;
                                  const endDate = new Date(new Date(iter.startDate).getTime() + iter.duration * 86400000);
                                  const endStr = endDate.toISOString().split('T')[0];
                                  return todayStr >= startStr && todayStr < endStr;
                              });
                              if (!activeIteration) {
                                  activeIteration = iterations.find(iter => iter.startDate > todayStr);
                              }
                              if (activeIteration) {
                                  const updateSprintMutation = `
                                      mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $iterationId: String!) {
                                          updateProjectV2ItemFieldValue(input: {
                                              projectId: $projectId,
                                              itemId: $itemId,
                                              fieldId: $fieldId,
                                              value: { iterationId: $iterationId }
                                          }) {
                                              projectV2Item { id }
                                          }
                                      }
                                  `;
                                  await graphqlWithPat(updateSprintMutation, {
                                      projectId,
                                      itemId: targetItemId,
                                      fieldId: iterationField.id,
                                      iterationId: activeIteration.id
                                  });
                                  console.log(`Assigned item ${targetItemId} to Sprint (${activeIteration.id})`);
                              }
                          }
                      };

                      // Helper: Compute metadata based on title, labels and PR diff
                      const computeMetadata = (rawTitle, isPr, author, additions, deletions, existingLabels = []) => {
                          const title = (rawTitle || '').toLowerCase();
                          const labelsLower = existingLabels.map(l => (typeof l === 'string' ? l : l.name || '').toLowerCase());
                          let labelsToAdd = new Set();
                          let kindName = "";
                          let scopeName = "";
                          let priorityName = "🟡 Medium";
                          let effortValue = 2;

                          const hasLabel = (lbl) => labelsLower.includes(lbl.toLowerCase());

                          // 1. Author and Dependency Detection
                          if (author === 'dependabot[bot]' || author.includes('bot') || title.includes('(deps)') || hasLabel('dependabot') || hasLabel('dependencies')) {
                              if (author === 'dependabot[bot]') labelsToAdd.add('dependabot');
                              labelsToAdd.add('dependencies');
                              labelsToAdd.add('scope:ci');
                              kindName = "📦 Build";
                              scopeName = "CI";
                              priorityName = "🔵 Low";
                              effortValue = 1;
                          } else {
                              // 2. Kind Detection (Prefix, Natural Language Keywords, or Existing Labels)
                              if (title.startsWith('breaking') || title.includes('breaking change') || title.startsWith('feat!') || title.startsWith('fix!') || hasLabel('breaking')) {
                                  labelsToAdd.add('enhancement');
                                  kindName = "💥 Breaking";
                                  priorityName = "🔴 Urgent";
                                  effortValue = 5;
                              } else if (title.startsWith('feat') || /\b(add|support|implement|new|feature|allow|provide|introduce)\b/.test(title) || hasLabel('enhancement') || hasLabel('feature')) {
                                  labelsToAdd.add('enhancement');
                                  kindName = "✨ Feature";
                                  priorityName = (title.includes('major') || title.includes('critical') || title.includes('core')) ? "🟠 High" : "🟡 Medium";
                                  effortValue = 3;
                              } else if (title.startsWith('fix') || /\b(fix|bug|defect|crash|error|fail|leak|broken|exception|wrong|fault)\b/.test(title) || hasLabel('bug')) {
                                  labelsToAdd.add('bug');
                                  kindName = "🐛 Bug";
                                  priorityName = (title.includes('critical') || title.includes('security') || title.includes('crash') || title.includes('freeze')) ? "🔴 Urgent" : "🟠 High";
                                  effortValue = (priorityName === "🔴 Urgent") ? 5 : 2;
                              } else if (title.startsWith('perf') || /\b(perf|performance|speed|slow|lag|optimize|optimise|fps|ram|trim)\b/.test(title) || hasLabel('perf')) {
                                  labelsToAdd.add('perf');
                                  labelsToAdd.add('enhancement');
                                  kindName = "⚡ Perf";
                                  priorityName = "🟡 Medium";
                                  effortValue = 3;
                              } else if (title.startsWith('refactor') || /\b(refactor|clean|cleanup|reorganize|restructure|simplify)\b/.test(title) || hasLabel('refactor')) {
                                  labelsToAdd.add('refactor');
                                  kindName = "♻️ Refactor";
                                  priorityName = "🟡 Medium";
                                  effortValue = 2;
                              } else if (title.startsWith('test') || /\b(test|tests|testing|coverage|unit test|assert)\b/.test(title) || hasLabel('testing')) {
                                  labelsToAdd.add('testing');
                                  kindName = "🧪 Test";
                                  priorityName = "🟡 Medium";
                                  effortValue = 2;
                              } else if (title.startsWith('docs') || /\b(docs|doc|documentation|readme|guide|comment|typo)\b/.test(title) || hasLabel('documentation')) {
                                  labelsToAdd.add('documentation');
                                  kindName = "📚 Docs";
                                  priorityName = "🔵 Low";
                                  effortValue = 1;
                              } else if (title.startsWith('build') || /\b(build|package|installer|setup|publish)\b/.test(title) || hasLabel('build')) {
                                  labelsToAdd.add('dependencies');
                                  labelsToAdd.add('scope:ci');
                                  kindName = "📦 Build";
                                  scopeName = "CI";
                                  priorityName = "🔵 Low";
                                  effortValue = 1;
                              } else if (title.startsWith('ci') || /\b(ci|workflow|pipeline|actions|github action|action)\b/.test(title) || hasLabel('ci')) {
                                  labelsToAdd.add('ci');
                                  labelsToAdd.add('actions');
                                  labelsToAdd.add('scope:ci');
                                  kindName = "⚙️ CI";
                                  scopeName = "CI";
                                  priorityName = "🔵 Low";
                                  effortValue = 1;
                              } else if (title.startsWith('chore') || /\b(chore|bump|license|gitignore)\b/.test(title) || hasLabel('chore')) {
                                  labelsToAdd.add('chore');
                                  kindName = "🔧 Chore";
                                  priorityName = "🔵 Low";
                                  effortValue = 1;
                              } else if (title.startsWith('style') || /\b(style|formatting|whitespace|lint|prettier)\b/.test(title)) {
                                  kindName = "🎨 Style";
                                  priorityName = "🔵 Low";
                                  effortValue = 1;
                              } else if (title.startsWith('revert') || /\b(revert|rollback)\b/.test(title)) {
                                  labelsToAdd.add('bug');
                                  kindName = "🐛 Bug";
                                  priorityName = "🟠 High";
                                  effortValue = 2;
                              } else {
                                  // Generic fallback for plain titles
                                  kindName = "✨ Feature";
                                  priorityName = "🟡 Medium";
                                  effortValue = 2;
                              }

                              // 3. Effort Story Points Calculation (Standardized Complexity Model)
                              if (kindName === "💥 Breaking" || priorityName === "🔴 Urgent") {
                                  effortValue = 5;
                              } else if (kindName === "✨ Feature" || kindName === "⚡ Perf") {
                                  effortValue = 3;
                              } else if (kindName === "🐛 Bug" || kindName === "♻️ Refactor" || kindName === "🧪 Test") {
                                  effortValue = 2;
                              } else {
                                  effortValue = 1;
                              }

                              // 4. Scope Detection (Tags, Natural Language Keywords, or Existing Labels)
                              if (title.includes('(overlay)') || /\b(overlay|taskbar|display|monitor|screen|dpi|downsize|position|clock|tray|column|columns|explorerpatcher|weather|overlap|overlapping)\b/.test(title) || hasLabel('scope:overlay')) {
                                  labelsToAdd.add('scope:overlay');
                                  scopeName = "Overlay";
                              } else if (title.includes('(core)') || title.includes('(tests)') || title.includes('(test)') || /\b(core|hardware|nvml|adl|igcl|wddm|pawnio|msr|driver|sensor|gpu|cpu|xunit)\b/.test(title) || hasLabel('scope:core')) {
                                  labelsToAdd.add('scope:core');
                                  scopeName = "Core";
                              } else if (title.includes('(notifier)') || /\b(notifier|toast|toastform|pipe)\b/.test(title) || hasLabel('scope:notifier')) {
                                  labelsToAdd.add('scope:notifier');
                                  scopeName = "Notifier";
                              } else if (title.includes('(monitor)') || /\b(telemetry|frequency|temperature|temp|load|metric|usage)\b/.test(title) || hasLabel('scope:monitor')) {
                                  labelsToAdd.add('scope:monitor');
                                  scopeName = "Monitor";
                              } else if (title.includes('(config)') || /\b(config|settings\.json|appsettings|configuration)\b/.test(title) || hasLabel('scope:config')) {
                                  labelsToAdd.add('scope:config');
                                  scopeName = "Config";
                              } else if (title.includes('(app)') || /\b(app|window|shell|settings|ui|svelte|wpf|frontend)\b/.test(title) || hasLabel('scope:app')) {
                                  labelsToAdd.add('scope:app');
                                  scopeName = "App";
                              } else if (title.includes('(docs)') || /\b(docs|vitepress|markdown)\b/.test(title) || hasLabel('documentation')) {
                                  scopeName = "Docs";
                              } else if (title.includes('(ci)') || title.includes('(actions)') || /\b(ci|pipeline|workflow|workflow_dispatch)\b/.test(title) || hasLabel('scope:ci')) {
                                  labelsToAdd.add('scope:ci');
                                  scopeName = "CI";
                              }

                              // Tech Stack Labels
                              if (['Core', 'Config', 'Monitor'].includes(scopeName) || title.includes('c#') || title.includes('.net') || hasLabel('csharp')) {
                                  labelsToAdd.add('csharp');
                              }
                              if (['App', 'Overlay'].includes(scopeName) || title.includes('svelte') || title.includes('css') || title.includes('frontend') || hasLabel('frontend')) {
                                  labelsToAdd.add('frontend');
                              }
                          }

                          // 5. Determine Native GitHub Issue Type (Bug, Feature, Task)
                          let nativeIssueTypeName = "Task";
                          if (kindName.includes("Bug")) {
                              nativeIssueTypeName = "Bug";
                          } else if (kindName.includes("Feature") || kindName.includes("Perf") || kindName.includes("Breaking")) {
                              nativeIssueTypeName = "Feature";
                          }

                          return { labelsToAdd, kindName, scopeName, priorityName, effortValue, nativeIssueTypeName };
                      };

                      // --- WORKFLOW_DISPATCH AUDIT & RECONCILIATION ---
                      if (!item) {
                          console.log("Triggered via workflow_dispatch: Auditing and reconciling Project #7 items...");
                          const itemsQuery = `
                              query($projectId: ID!) {
                                  node(id: $projectId) {
                                      ... on ProjectV2 {
                                          items(first: 100) {
                                              nodes {
                                                  id
                                                  content {
                                                      __typename
                                                      ... on Issue {
                                                          id
                                                          number
                                                          title
                                                          state
                                                          stateReason
                                                          author { login }
                                                          assignees(first: 5) { totalCount }
                                                          labels(first: 10) { nodes { name } }
                                                          issueType { id name }
                                                      }
                                                      ... on PullRequest {
                                                          number
                                                          title
                                                          state
                                                          merged
                                                          isDraft
                                                          author { login }
                                                          additions
                                                          deletions
                                                          labels(first: 10) { nodes { name } }
                                                      }
                                                  }
                                                  fieldValues(first: 20) {
                                                      nodes {
                                                          ... on ProjectV2ItemFieldSingleSelectValue {
                                                              field { ... on ProjectV2SingleSelectField { name } }
                                                              name
                                                          }
                                                          ... on ProjectV2ItemFieldNumberValue {
                                                              field { ... on ProjectV2Field { name } }
                                                              number
                                                          }
                                                      }
                                                  }
                                              }
                                          }
                                      }
                                  }
                              }
                          `;
                          const itemsData = await graphqlWithPat(itemsQuery, { projectId });
                          const projectItems = itemsData.node ? itemsData.node.items.nodes : [];
                          console.log(`Found ${projectItems.length} items in Project #7.`);

                          for (const pItem of projectItems) {
                              if (!pItem.content) continue;
                              const content = pItem.content;
                              const isPr = content.__typename === 'PullRequest';
                              const currentStatus = pItem.fieldValues.nodes.find(v => v.field && v.field.name === 'Status')?.name;
                              const currentEffort = pItem.fieldValues.nodes.find(v => v.field && v.field.name === 'Effort')?.number;
                              const currentKind = pItem.fieldValues.nodes.find(v => v.field && v.field.name === 'Kind')?.name;
                              const currentScope = pItem.fieldValues.nodes.find(v => v.field && v.field.name === 'Scope')?.name;
                              const currentPriority = pItem.fieldValues.nodes.find(v => v.field && v.field.name === 'Priority')?.name;

                              let expectedStatus = '';
                              if (isPr) {
                                  if (content.state === 'MERGED' || content.merged) {
                                      expectedStatus = 'Done';
                                  } else if (content.state === 'CLOSED') {
                                      expectedStatus = 'Cancelled';
                                  } else if (content.isDraft) {
                                      expectedStatus = 'In Progress';
                                  } else {
                                      expectedStatus = 'In Review';
                                  }
                              } else {
                                  if (content.state === 'CLOSED') {
                                      expectedStatus = (content.stateReason === 'NOT_PLANNED') ? 'Cancelled' : 'Done';
                                  } else if (content.assignees && content.assignees.totalCount > 0) {
                                      expectedStatus = 'In Progress';
                                  } else {
                                      expectedStatus = 'Todo';
                                  }
                              }

                              if (expectedStatus && currentStatus !== expectedStatus) {
                                  console.log(`Reconciling #${content.number} (${content.__typename}): Status '${currentStatus}' -> '${expectedStatus}'`);
                                  await updateSingleSelectField(pItem.id, 'Status', expectedStatus);
                              }

                              // Populate missing metadata
                              const authorLogin = content.author ? content.author.login : '';
                              const contentLabels = (content.labels && content.labels.nodes) ? content.labels.nodes.map(l => l.name) : [];
                              const meta = computeMetadata(content.title, isPr, authorLogin, content.additions, content.deletions, contentLabels);

                              // Ensure native GitHub Issue Type is assigned
                              if (content.__typename === 'Issue' && !content.issueType && meta.nativeIssueTypeName) {
                                  await updateNativeIssueType(content.id, meta.nativeIssueTypeName);
                              }

                              if (!currentEffort && meta.effortValue !== undefined) {
                                  await updateNumberField(pItem.id, 'Effort', meta.effortValue);
                              }
                              if (!currentKind && meta.kindName) {
                                  await updateSingleSelectField(pItem.id, 'Kind', meta.kindName);
                              }
                              if (!currentScope && meta.scopeName) {
                                  await updateSingleSelectField(pItem.id, 'Scope', meta.scopeName);
                              }
                              if (!currentPriority && meta.priorityName) {
                                  await updateSingleSelectField(pItem.id, 'Priority', meta.priorityName);
                              }
                          }
                          console.log("Project #7 audit and reconciliation completed.");
                          return;
                      }

                      // --- EVENT-DRIVEN AUTOMATION (Issues & Pull Requests) ---
                      const title = item.title || '';
                      const author = item.user ? item.user.login : '';
                      const number = item.number;
                      const contentId = item.node_id;

                      // 2. Add Item to Project #7 if not present (idempotent)
                      let itemId;
                      try {
                          const addItemMutation = `
                              mutation($projectId: ID!, $contentId: ID!) {
                                  addProjectV2ItemById(input: {projectId: $projectId, contentId: $contentId}) {
                                      item { id }
                                  }
                              }
                          `;
                          const addItemRes = await graphqlWithPat(addItemMutation, { projectId, contentId });
                          itemId = addItemRes.addProjectV2ItemById.item.id;
                      } catch (err) {
                          core.setFailed(`Project item addition failed: ${err.message}`);
                          return;
                      }

                      // 3. Determine Lifecycle Stage (Status lane)
                      // Note: Initial 'Todo' on open, and 'Done' on PR merge are automatically handled by Project #7 built-in workflows.
                      let targetStatus = '';
                      if (action === 'closed') {
                          if (isIssue && item.state_reason === 'not_planned') {
                              targetStatus = 'Cancelled';
                          }
                      } else if (isIssue) {
                          if (action === 'assigned') {
                              targetStatus = 'In Progress';
                          } else if (action === 'unassigned') {
                              targetStatus = (item.assignees && item.assignees.length > 0) ? 'In Progress' : 'Todo';
                          }
                      } else {
                          // Pull Request Lifecycle Stages
                          if (action === 'converted_to_draft') {
                              targetStatus = 'In Progress';
                          } else if (action === 'ready_for_review' || action === 'review_requested') {
                              targetStatus = 'In Review';
                          } else if (action === 'opened' || action === 'synchronize') {
                              targetStatus = item.draft ? 'In Progress' : 'In Review';
                          }
                      }

                      if (targetStatus) {
                          await updateSingleSelectField(itemId, 'Status', targetStatus);
                          console.log(`Assigned #${number} to Status lane: ${targetStatus}`);
                      }

                      // 4. Compute and Assign Item Metadata
                      const existingLabels = (item.labels || []).map(l => (typeof l === 'string' ? l : l.name || ''));
                      const meta = computeMetadata(title, !isIssue, author, item.additions, item.deletions, existingLabels);

                      // Set Native GitHub Issue Type if missing
                      if (isIssue && meta.nativeIssueTypeName) {
                          const currentNativeType = item.issue_type || item.issueType;
                          if (!currentNativeType) {
                              await updateNativeIssueType(contentId, meta.nativeIssueTypeName);
                          }
                      }

                      // Apply Labels (filter out already existing labels)
                      const finalLabels = Array.from(meta.labelsToAdd).filter(l => !existingLabels.map(el => el.toLowerCase()).includes(l.toLowerCase()));
                      if (finalLabels.length > 0) {
                          try {
                              await github.rest.issues.addLabels({
                                  owner: context.repo.owner,
                                  repo: context.repo.repo,
                                  issue_number: number,
                                  labels: finalLabels
                              });
                              console.log(`Labeled #${number} as github-actions[bot] with: ${finalLabels.join(', ')}`);
                          } catch (err) {
                              console.warn(`Label addition skipped: ${err.message}`);
                          }
                      }

                      // Apply Sprint, Kind, Scope, Priority, Effort (on non-closed events)
                      if (action !== 'closed') {
                          await updateSprintField(itemId);

                          if (meta.kindName) {
                              await updateSingleSelectField(itemId, 'Kind', meta.kindName);
                          }
                          if (meta.scopeName) {
                              await updateSingleSelectField(itemId, 'Scope', meta.scopeName);
                          }
                          if (meta.priorityName) {
                              await updateSingleSelectField(itemId, 'Priority', meta.priorityName);
                          }
                          if (meta.effortValue !== undefined) {
                              await updateNumberField(itemId, 'Effort', meta.effortValue);
                          }
                      }
