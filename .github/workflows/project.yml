name: Project Automation

on:
    issues:
        types: [opened, closed]
    pull_request_target:
        types: [opened, closed]
    workflow_dispatch:

permissions:
    contents: read

jobs:
    setup:
        name: Project Setup
        runs-on: ubuntu-latest
        permissions:
            issues: write
            pull-requests: write

        steps:
            - name: Configure Item
              uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
              env:
                  PROJECTS: ${{ secrets.PROJECTS }}
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  script: |
                      const action = context.payload.action;
                      const isIssue = !!context.payload.issue;
                      const item = isIssue ? context.payload.issue : context.payload.pull_request;
                      const title = item ? item.title.toLowerCase() : '';
                      const author = item ? item.user.login : '';
                      const number = item ? item.number : 0;
                      const contentId = item ? item.node_id : '';

                      if (!item) {
                          console.log("Ran via workflow_dispatch.");
                          return;
                      }

                      const owner = context.repo.owner;
                      const projectNumber = 7;
                      const patToken = process.env.PROJECTS || process.env.GITHUB_TOKEN;
                      const graphqlWithPat = github.graphql.defaults({
                          headers: {
                              authorization: `token ${patToken}`
                          }
                      });

                      // 2. Add to User Project #7 & Fetch Field Schema
                      const projectQuery = `
                          query($owner: String!, $number: Int!) {
                              user(login: $owner) {
                                  projectV2(number: $number) {
                                      id
                                      fields(first: 100) {
                                          nodes {
                                              ... on ProjectV2IterationField {
                                                  id
                                                  name
                                                  configuration {
                                                      iterations {
                                                          id
                                                          startDate
                                                          duration
                                                      }
                                                  }
                                              }
                                              ... on ProjectV2SingleSelectField {
                                                  id
                                                  name
                                                  options {
                                                      id
                                                      name
                                                  }
                                              }
                                              ... on ProjectV2Field {
                                                  id
                                                  name
                                                  dataType
                                              }
                                          }
                                      }
                                  }
                              }
                          }
                      `;

                      let project, projectId, allFields, itemId;
                      try {
                          const projectData = await graphqlWithPat(projectQuery, { owner, number: projectNumber });
                          project = projectData.user ? projectData.user.projectV2 : null;

                          if (!project) {
                              core.setFailed(`Project #${projectNumber} not found under user '${owner}'. Ensure PROJECTS secret is configured.`);
                              return;
                          }

                          projectId = project.id;
                          allFields = project.fields.nodes;

                          // Add Item to Project #7
                          const addItemMutation = `
                              mutation($projectId: ID!, $contentId: ID!) {
                                  addProjectV2ItemById(input: {projectId: $projectId, contentId: $contentId}) {
                                      item { id }
                                  }
                              }
                          `;
                          const addItemRes = await graphqlWithPat(addItemMutation, { projectId, contentId });
                          itemId = addItemRes.addProjectV2ItemById.item.id;
                      } catch (err) {
                          core.setFailed(`Project fetch/addition failed: ${err.message}`);
                          return;
                      }

                      // Helper for updating single select fields accurately
                      const updateSingleSelectField = async (fieldName, targetOptionName) => {
                          const field = allFields.find(f => f.name && f.name.toLowerCase() === fieldName.toLowerCase());
                          if (field && field.options && targetOptionName) {
                              const matchedOption = field.options.find(opt =>
                                  opt.name.toLowerCase() === targetOptionName.toLowerCase() ||
                                  opt.name.toLowerCase().includes(targetOptionName.toLowerCase()) ||
                                  targetOptionName.toLowerCase().includes(opt.name.toLowerCase())
                              );
                              if (matchedOption) {
                                  const updateMutation = `
                                      mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                                          updateProjectV2ItemFieldValue(input: {
                                              projectId: $projectId,
                                              itemId: $itemId,
                                              fieldId: $fieldId,
                                              value: { singleSelectOptionId: $optionId }
                                          }) {
                                              projectV2Item { id }
                                          }
                                      }
                                  `;
                                  await graphqlWithPat(updateMutation, {
                                      projectId,
                                      itemId,
                                      fieldId: field.id,
                                      optionId: matchedOption.id
                                  });
                                  console.log(`Assigned #${number} to ${fieldName}: ${matchedOption.name}`);
                              }
                          }
                      };

                      // Helper for updating number fields (Effort)
                      const updateNumberField = async (fieldName, numValue) => {
                          const field = allFields.find(f => f.name && f.name.toLowerCase() === fieldName.toLowerCase());
                          if (field && field.id && numValue !== undefined) {
                              const updateMutation = `
                                  mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $numValue: Float!) {
                                      updateProjectV2ItemFieldValue(input: {
                                          projectId: $projectId,
                                          itemId: $itemId,
                                          fieldId: $fieldId,
                                          value: { number: $numValue }
                                      }) {
                                          projectV2Item { id }
                                      }
                                  `;
                              await graphqlWithPat(updateMutation, {
                                  projectId,
                                  itemId,
                                  fieldId: field.id,
                                  numValue: parseFloat(numValue)
                              });
                              console.log(`Assigned #${number} to ${fieldName}: ${numValue}`);
                          }
                      };

                      // --- CLOSED EVENT HANDLING (Status = Done or Cancelled) ---
                      if (action === 'closed') {
                          let isMergedOrCompleted = false;
                          if (!isIssue) {
                              isMergedOrCompleted = !!item.merged;
                          } else {
                              isMergedOrCompleted = item.state_reason === 'completed' || !item.state_reason;
                          }

                          if (isMergedOrCompleted) {
                              await updateSingleSelectField('Status', 'Done');
                              console.log(`Closed #${number} as Merged/Completed -> Status: Done`);
                          } else {
                              await updateSingleSelectField('Status', 'Cancelled');
                              console.log(`Closed #${number} as Unmerged/Not Planned -> Status: Cancelled`);
                          }
                          return;
                      }

                      // --- OPENED EVENT HANDLING (Fields, Sprint, Labels Calculation) ---
                      let labelsToAdd = new Set();
                      let kindName = "";
                      let scopeName = "";
                      let priorityName = "🟡 Medium";
                      let effortValue = 2; // Default Fibonacci point = 2

                      if (author === 'dependabot[bot]' || author.includes('bot') || title.includes('(deps)')) {
                          if (author === 'dependabot[bot]') labelsToAdd.add('dependabot');
                          labelsToAdd.add('dependencies');
                          labelsToAdd.add('scope:ci');
                          kindName = "📦 Build";
                          scopeName = "CI";
                          priorityName = "🔵 Low";
                          effortValue = 1;
                      } else {
                          // Conventional Commits Semantic Evaluation
                          // 1. breaking: (Breaking Change)
                          if (title.includes('breaking') || title.includes('!') || title.startsWith('breaking')) {
                              labelsToAdd.add('enhancement');
                              kindName = "💥 Breaking";
                              priorityName = "🔴 Urgent";
                              effortValue = 5;
                          }
                          // 2. feat: (Feature)
                          else if (title.startsWith('feat')) {
                              labelsToAdd.add('enhancement');
                              kindName = "✨ Feature";
                              priorityName = "🟠 High";
                              effortValue = 3;
                          }
                          // 3. fix: (Bug Fix)
                          else if (title.startsWith('fix')) {
                              labelsToAdd.add('bug');
                              kindName = "🐛 Bug";
                              priorityName = title.includes('critical') || title.includes('security') ? "🔴 Urgent" : "🟠 High";
                              effortValue = 2;
                          }
                          // 4. perf: (Performance Optimization)
                          else if (title.startsWith('perf')) {
                              labelsToAdd.add('perf');
                              labelsToAdd.add('enhancement');
                              kindName = "⚡ Perf";
                              priorityName = "🟡 Medium";
                              effortValue = 3;
                          }
                          // 5. refactor: (Code Cleanup)
                          else if (title.startsWith('refactor')) {
                              labelsToAdd.add('refactor');
                              kindName = "♻️ Refactor";
                              priorityName = "🟡 Medium";
                              effortValue = 2;
                          }
                          // 6. test: (Testing)
                          else if (title.startsWith('test')) {
                              labelsToAdd.add('testing');
                              kindName = "🧪 Test";
                              priorityName = "🟡 Medium";
                              effortValue = 2;
                          }
                          // 7. docs: (Documentation)
                          else if (title.startsWith('docs')) {
                              labelsToAdd.add('documentation');
                              kindName = "📚 Docs";
                              priorityName = "🔵 Low";
                              effortValue = 1;
                          }
                          // 8. build: (Build & Dependencies)
                          else if (title.startsWith('build')) {
                              labelsToAdd.add('dependencies');
                              labelsToAdd.add('scope:ci');
                              kindName = "📦 Build";
                              scopeName = "CI";
                              priorityName = "🔵 Low";
                              effortValue = 1;
                          }
                          // 9. ci: (CI Workflows)
                          else if (title.startsWith('ci')) {
                              labelsToAdd.add('ci');
                              labelsToAdd.add('actions');
                              labelsToAdd.add('scope:ci');
                              kindName = "⚙️ CI";
                              scopeName = "CI";
                              priorityName = "🔵 Low";
                              effortValue = 1;
                          }
                          // 10. chore: (Housekeeping)
                          else if (title.startsWith('chore')) {
                              labelsToAdd.add('chore');
                              kindName = "🔧 Chore";
                              priorityName = "🔵 Low";
                              effortValue = 1;
                          }
                          // 11. style: (Formatting)
                          else if (title.startsWith('style')) {
                              kindName = "🎨 Style";
                              priorityName = "🔵 Low";
                              effortValue = 1;
                          }
                          // 12. revert: (Revert Commit)
                          else if (title.startsWith('revert')) {
                              labelsToAdd.add('bug');
                              kindName = "🐛 Bug";
                              priorityName = "🟠 High";
                              effortValue = 2;
                          }

                          // Fibonacci Scale for PRs based on total code additions + deletions
                          if (!isIssue && item.additions !== undefined && item.deletions !== undefined) {
                              const totalDiff = item.additions + item.deletions;
                              if (totalDiff < 30) effortValue = 1;
                              else if (totalDiff <= 100) effortValue = 2;
                              else if (totalDiff <= 300) effortValue = 3;
                              else if (totalDiff <= 600) effortValue = 5;
                              else effortValue = 8;
                          }

                          // Multi-Scope Label Detection (Tags ALL matching component scopes)
                          if (title.includes('(core)')) labelsToAdd.add('scope:core');
                          if (title.includes('(app)')) labelsToAdd.add('scope:app');
                          if (title.includes('(overlay)')) labelsToAdd.add('scope:overlay');
                          if (title.includes('(monitor)')) labelsToAdd.add('scope:monitor');
                          if (title.includes('(config)')) labelsToAdd.add('scope:config');
                          if (title.includes('(ci)') || title.includes('(actions)')) labelsToAdd.add('scope:ci');

                          if (title.includes('(core)') || title.includes('(config)') || title.includes('(monitor)')) labelsToAdd.add('csharp');
                          if (title.includes('(app)') || title.includes('(overlay)')) labelsToAdd.add('frontend');

                          // Architectural Scope Precedence for Single-Select Field (Core > App > Overlay > Monitor > Config > CI)
                          if (title.includes('(core)')) scopeName = "Core";
                          else if (title.includes('(app)')) scopeName = "App";
                          else if (title.includes('(overlay)')) scopeName = "Overlay";
                          else if (title.includes('(monitor)')) scopeName = "Monitor";
                          else if (title.includes('(config)')) scopeName = "Config";
                          else if (title.includes('(ci)') || title.includes('(actions)')) scopeName = "CI";
                      }

                      // Label Addition runs under GITHUB_TOKEN -> records actor as github-actions[bot]
                      const finalLabels = Array.from(labelsToAdd);
                      if (finalLabels.length > 0) {
                          await github.rest.issues.addLabels({
                              owner: context.repo.owner,
                              repo: context.repo.repo,
                              issue_number: number,
                              labels: finalLabels
                          });
                          console.log(`Labeled #${number} as github-actions[bot] with: ${finalLabels.join(', ')}`);
                      }

                      // A. Assign Active Sprint / Iteration
                      const iterationField = allFields.find(f => f.configuration && f.configuration.iterations);
                      if (iterationField) {
                          const todayStr = new Date().toISOString().split('T')[0];
                          const iterations = iterationField.configuration.iterations;

                          let activeIteration = iterations.find(iter => {
                              const startStr = iter.startDate;
                              const endDate = new Date(new Date(iter.startDate).getTime() + iter.duration * 86400000);
                              const endStr = endDate.toISOString().split('T')[0];
                              return todayStr >= startStr && todayStr < endStr;
                          });

                          if (!activeIteration) {
                              activeIteration = iterations.find(iter => iter.startDate > todayStr);
                          }

                          if (activeIteration) {
                              const updateSprintMutation = `
                                  mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $iterationId: String!) {
                                      updateProjectV2ItemFieldValue(input: {
                                          projectId: $projectId,
                                          itemId: $itemId,
                                          fieldId: $fieldId,
                                          value: { iterationId: $iterationId }
                                      }) {
                                          projectV2Item { id }
                                      }
                                  }
                              `;
                              await graphqlWithPat(updateSprintMutation, {
                                  projectId,
                                  itemId,
                                  fieldId: iterationField.id,
                                  iterationId: activeIteration.id
                              });
                              console.log(`Assigned #${number} to Sprint (${activeIteration.id})`);
                          }
                      }

                      // B. Assign Kind Custom Field
                      if (kindName) {
                          await updateSingleSelectField('Kind', kindName);
                      }

                      // C. Assign Scope Custom Field
                      if (scopeName) {
                          await updateSingleSelectField('Scope', scopeName);
                      }

                      // D. Assign Priority Custom Field
                      if (priorityName) {
                          await updateSingleSelectField('Priority', priorityName);
                      }

                      // E. Assign Effort Custom Field (Number)
                      if (effortValue !== undefined) {
                          await updateNumberField('Effort', effortValue);
                      }
