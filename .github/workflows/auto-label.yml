name: Auto Label Bot PRs
on:
    pull_request:
        types: [opened]

permissions:
    pull-requests: write

jobs:
    label-bot-pr:
        if: contains(github.actor, '[bot]')
        runs-on: ubuntu-latest
        steps:
            - name: Add automated-pr label
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: gh pr edit ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --add-label "automated-pr"
