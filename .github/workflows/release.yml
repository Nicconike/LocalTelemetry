name: Release

on:
    push:
        branches: [master]
        paths:
            - ".github/workflows/release.yml"
            - "setup.iss"
            - "src/LocalTelemetry.App/**"
            - "src/LocalTelemetry.Core/**"
            - "src/LocalTelemetry.Notifier/**"

permissions:
    contents: read

jobs:
    release:
        name: Release
        runs-on: windows-latest
        permissions:
            contents: read
            id-token: write
            attestations: write
        steps:
            # 1. Generate GitHub App Token for Protected Branch Commit/Push Access
            - name: Generate GitHub App Token
              id: app_token
              uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
              with:
                  client-id: ${{ secrets.APP_CLIENT_ID }}
                  private-key: ${{ secrets.APP_PRIVATE_KEY }}

            # 2. Checkout Code
            - name: Checkout Code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  token: ${{ steps.app_token.outputs.token }}
                  fetch-depth: 0

            # 3. Import GPG Private Key for Signing Release Tags
            - name: Import GPG Key
              uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
              with:
                  gpg_private_key: ${{ secrets.PGP_PRIVATE_KEY }}
                  git_config_global: true
                  git_user_signingkey: true
                  git_tag_gpgsign: true
                  trust_level: 5

            # 4. Setup Bun & Build Svelte Frontend
            - name: Setup Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

            - name: Build Svelte Frontend
              run: |
                  bun install
                  bun run build
              working-directory: src/LocalTelemetry.App/Settings/wwwroot

            # 5. Calculate Semantic Version Tag based on Conventional Commits
            - name: Generate Version Tag
              id: tag_version
              uses: mathieudutour/github-tag-action@a22cf08638b34d5badda920f9daf6e72c477b07b # v6.2
              with:
                  github_token: ${{ steps.app_token.outputs.token }}
                  tag_prefix: v
                  release_branches: main
                  pre_release_branches: master
                  default_prerelease_bump: prerelease
                  custom_release_rules: feat:prerelease,fix:prerelease,perf:prerelease
                  append_to_pre_release_tag: beta
                  dry_run: true

            # 6. Create & Push GPG-Signed Release Tag
            - name: Create & Push Signed Release Tag
              if: ${{ steps.tag_version.outputs.new_tag != '' }}
              shell: pwsh
              run: |
                  $tag = "v${{ steps.tag_version.outputs.new_version }}"
                  $exists = git ls-remote --tags origin "refs/tags/$tag"
                  if ($LASTEXITCODE -ne 0) { throw "Failed to check remote tags" }
                  if (-not $exists) {
                      git tag -s -m "Release $tag" "$tag"
                      git push origin "refs/tags/$tag"
                  } else {
                      Write-Host "Tag $tag already exists on origin; skipping creation"
                  }

            # 7. Setup .NET 10 & Publish Executable
            - name: Setup .NET 10 SDK
              uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
              with:
                  dotnet-version: 10.0.x

            # Fetch the tag created in step 6 so MinVer derives the exact version
            # from the tag instead of the untagged default (0.0.0-alpha.0.N).
            - name: Fetch Release Tag
              if: ${{ steps.tag_version.outputs.new_tag != '' }}
              run: git fetch --tags --force

            - name: Publish Single-File Executable
              if: ${{ steps.tag_version.outputs.new_tag != '' }}
              run: dotnet publish src/LocalTelemetry.App/LocalTelemetry.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:MinVerVersionOverride=${{ steps.tag_version.outputs.new_version }} -o ./publish

            # 8. Install & Run Inno Setup Compiler
            - name: Install Inno Setup & Compile Installer
              if: ${{ steps.tag_version.outputs.new_tag != '' }}
              shell: pwsh
              run: |
                  $iscc = "iscc"
                  $possiblePaths = @(
                        "C:\Program Files\Inno Setup 7\ISCC.exe",
                        "C:\Program Files (x86)\Inno Setup 7\ISCC.exe"
                    )
                  foreach ($path in $possiblePaths) {
                        if (Test-Path $path) {
                            $iscc = $path
                            break
                        }
                    }
                  if ($iscc -eq "iscc" -and -not (Get-Command iscc -ErrorAction SilentlyContinue)) {
                        winget install --id JRSoftware.InnoSetup.7 --exact --silent --accept-package-agreements --accept-source-agreements --disable-interactivity
                        foreach ($path in $possiblePaths) {
                            if (Test-Path $path) {
                                $iscc = $path
                                break
                            }
                        }
                        if ($iscc -eq "iscc") {
                            $found = Get-ChildItem -Path "C:\Program Files*" -Filter "ISCC.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
                            if ($found) { $iscc = $found.FullName }
                        }
                    }
                  if (-not (Test-Path $iscc) -and -not (Get-Command $iscc -ErrorAction SilentlyContinue)) {
                        throw "ISCC.exe not found after winget install"
                    }
                  $ver = "${{ steps.tag_version.outputs.new_version }}"
                  $numVer = ($ver -split '-')[0]
                  if ($numVer.Split('.').Count -eq 3) { $numVer = "$numVer.0" }
                  & $iscc /DAppVersion=$ver /DAppVersionInfoVersion=$numVer setup.iss

            # 9. Package Portable Archive & Generate SHA-256 Checksums
            - name: Package Portable ZIP & SHA-256 Checksums
              if: ${{ steps.tag_version.outputs.new_tag != '' }}
              shell: pwsh
              run: |
                  Compress-Archive -Path ./publish/* -DestinationPath ./LocalTelemetry-win-x64.zip
                  Get-FileHash -Path ./LocalTelemetrySetup.exe, ./LocalTelemetry-win-x64.zip -Algorithm SHA256 | ForEach-Object { "{0}  {1}" -f $_.Hash, (Split-Path $_.Path -Leaf) } | Set-Content ./checksums.txt

            # 10. Generate Cryptographic SLSA Artifact Attestations
            - name: Generate Build Artifact Attestations
              if: ${{ steps.tag_version.outputs.new_tag != '' }}
              uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
              with:
                  subject-path: |
                      ${{ github.workspace }}/LocalTelemetrySetup.exe
                      ${{ github.workspace }}/LocalTelemetry-win-x64.zip
                  show-summary: true

            # 11. Generate Release Notes with git-cliff
            - name: Install git-cliff
              if: ${{ steps.tag_version.outputs.new_tag != '' }}
              uses: taiki-e/install-action@cb33e69fad06166ca28a42b2575e4dadabf62ee8 # v2
              with:
                  tool: git-cliff

            - name: Generate Release Notes
              if: ${{ steps.tag_version.outputs.new_tag != '' }}
              env:
                  GITHUB_TOKEN: ${{ steps.app_token.outputs.token }}
              run: git-cliff --config cliff.toml --latest --strip header -o release-body.md

            # 12. Publish Official GitHub Release
            - name: Publish GitHub Release
              if: ${{ steps.tag_version.outputs.new_tag != '' }}
              uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
              with:
                  token: ${{ steps.app_token.outputs.token }}
                  tag_name: ${{ steps.tag_version.outputs.new_tag }}
                  name: ${{ steps.tag_version.outputs.new_tag }}
                  body_path: release-body.md
                  prerelease: true
                  files: |
                      ./LocalTelemetrySetup.exe
                      ./LocalTelemetry-win-x64.zip
                      ./checksums.txt

            # 13. Generate CHANGELOG & Commit via GitHub REST API
            - name: Generate CHANGELOG
              id: gen_changelog
              if: ${{ steps.tag_version.outputs.new_tag != '' }}
              shell: pwsh
              env:
                  GITHUB_TOKEN: ${{ steps.app_token.outputs.token }}
              run: |
                  git-cliff --config cliff.toml -o CHANGELOG.md
                  $changedFiles = git diff --name-only -- CHANGELOG.md
                  if ($changedFiles) {
                      "changed=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
                  }

            - name: Commit CHANGELOG
              if: ${{ steps.tag_version.outputs.new_tag != '' && steps.gen_changelog.outputs.changed == 'true' }}
              shell: pwsh
              env:
                  GH_TOKEN: ${{ steps.app_token.outputs.token }}
              run: |
                  $content = [Convert]::ToBase64String([IO.File]::ReadAllBytes("$pwd/CHANGELOG.md"))
                  $sha = gh api "repos/${{ github.repository }}/contents/CHANGELOG.md" --jq .sha
                  $body = @{
                      message = "chore: Update Changelog for ${{ steps.tag_version.outputs.new_tag }} [skip ci]"
                      content = $content
                      sha = $sha
                      branch = "master"
                  } | ConvertTo-Json
                  $body | gh api --method PUT "repos/${{ github.repository }}/contents/CHANGELOG.md" --input - --silent
