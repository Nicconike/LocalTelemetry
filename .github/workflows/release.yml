name: Release

on:
    push:
        branches: [master]
        paths:
            - ".github/workflows/release.yml"
            - "setup.iss"
            - "src/LocalTelemetry.App/**"
            - "src/LocalTelemetry.Core/**"
            - "src/LocalTelemetry.Notifier/**"

permissions:
    contents: read

jobs:
    prepare-release:
        name: Prepare Semantic Release Tag
        runs-on: ubuntu-latest
        outputs:
            new_tag: ${{ steps.resolve_tag.outputs.new_tag }}
            new_version: ${{ steps.resolve_tag.outputs.new_version }}
        steps:
            - name: Generate GitHub App Token
              id: app_token
              uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
              with:
                  client-id: ${{ secrets.APP_CLIENT_ID }}
                  private-key: ${{ secrets.APP_PRIVATE_KEY }}

            - name: Checkout Repo
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  token: ${{ steps.app_token.outputs.token }}
                  fetch-depth: 0

            - name: Fetch All Tags
              run: git fetch --tags --force

            - name: Generate Semantic Version Tag
              id: tag_version
              uses: mathieudutour/github-tag-action@af99e60ce8132224b8e6ebab5023449fe256ed46 # v7.0.0
              with:
                  github_token: ${{ steps.app_token.outputs.token }}
                  tag_prefix: v
                  release_branches: main
                  pre_release_branches: master
                  default_prerelease_bump: prerelease
                  custom_release_rules: feat:prerelease,fix:prerelease,perf:prerelease
                  append_to_pre_release_tag: rc
                  fetch_all_tags: true
                  initial_version: 1.0.0
                  dry_run: true

            - name: Ensure RC tag starts at 1
              id: resolve_tag
              run: |
                  TAG="${{ steps.tag_version.outputs.new_tag }}"
                  VER="${{ steps.tag_version.outputs.new_version }}"
                  if [[ "$VER" =~ -rc\.0$ ]]; then
                      VER="${VER%-rc.0}-rc.1"
                      TAG="v$VER"
                  fi
                  echo "new_tag=$TAG" >> "$GITHUB_OUTPUT"
                  echo "new_version=$VER" >> "$GITHUB_OUTPUT"

    publish-release:
        name: Build, Package & Publish Release
        needs: [prepare-release]
        if: ${{ needs.prepare-release.outputs.new_tag != '' }}
        runs-on: windows-latest
        permissions:
            contents: write
            id-token: write
            attestations: write
        env:
            DOTNET_CLI_TELEMETRY_OPTOUT: "1"
            DOTNET_NOLOGO: "true"
        steps:
            - name: Generate GitHub App Token
              id: app_token
              uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
              with:
                  client-id: ${{ secrets.APP_CLIENT_ID }}
                  private-key: ${{ secrets.APP_PRIVATE_KEY }}

            - name: Checkout Repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  token: ${{ steps.app_token.outputs.token }}
                  fetch-depth: 0

            - name: Setup Bun Runtime
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

            - name: Build Svelte Frontend Assets
              run: |
                  bun install --frozen-lockfile --ignore-scripts
                  bun run build
              working-directory: src/LocalTelemetry.App/Settings/wwwroot

            - name: Setup .NET 10 SDK
              uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
              with:
                  dotnet-version: 10.0.x

            - name: Fetch Release Tag
              run: git fetch --tags --force

            - name: Publish Single-File Executable
              run: dotnet publish src/LocalTelemetry.App/LocalTelemetry.App.csproj -c Release -r win-x64 --no-self-contained -p:PublishSingleFile=true -p:MinVerVersionOverride=${{ needs.prepare-release.outputs.new_version }} -o ./publish

            - name: Download PawnIO Driver Installer
              shell: pwsh
              run: |
                  $url = "https://github.com/namazso/PawnIO.Setup/releases/latest/download/PawnIO_setup.exe"
                  Invoke-WebRequest -Uri $url -OutFile "./publish/PawnIO_setup.exe"
                  Write-Host "Downloaded PawnIO_setup.exe into publish directory."

            - name: Compile Inno Setup Windows Installer
              shell: pwsh
              run: |
                  $possiblePaths = @(
                      "C:\Program Files\Inno Setup 7\ISCC.exe",
                      "C:\Program Files (x86)\Inno Setup 7\ISCC.exe"
                  )
                  $iscc = "iscc"
                  foreach ($path in $possiblePaths) {
                      if (Test-Path $path) {
                          $iscc = $path
                          break
                      }
                  }
                  if ($iscc -eq "iscc" -and -not (Get-Command iscc -ErrorAction SilentlyContinue)) {
                      winget install --id JRSoftware.InnoSetup.7 --exact --silent --accept-package-agreements --accept-source-agreements --disable-interactivity
                      foreach ($path in $possiblePaths) {
                          if (Test-Path $path) {
                              $iscc = $path
                              break
                          }
                      }
                      if ($iscc -eq "iscc") {
                          $found = Get-ChildItem -Path "C:\Program Files*" -Filter "ISCC.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
                          if ($found) { $iscc = $found.FullName }
                      }
                  }
                  if (-not (Test-Path $iscc) -and -not (Get-Command $iscc -ErrorAction SilentlyContinue)) {
                      throw "ISCC.exe not found after winget install"
                  }
                  $ver = "${{ needs.prepare-release.outputs.new_version }}"
                  $numVer = ($ver -split '-')[0]
                  if ($numVer.Split('.').Count -eq 3) { $numVer = "$numVer.0" }
                  & $iscc /DAppVersion=$ver /DAppVersionInfoVersion=$numVer setup.iss

            - name: Package Portable Archive & SHA-256 Checksums
              shell: pwsh
              run: |
                  Compress-Archive -Path ./publish/* -DestinationPath ./LocalTelemetry-win-x64.zip
                  $hashes = Get-FileHash -Path ./LocalTelemetrySetup.exe, ./LocalTelemetry-win-x64.zip -Algorithm SHA256
                  $hashes | ForEach-Object { "{0}  {1}" -f $_.Hash, (Split-Path $_.Path -Leaf) } | Set-Content ./checksums.txt
                  $setupHash = ($hashes | Where-Object { $_.Path -like "*LocalTelemetrySetup.exe" }).Hash
                  $zipHash = ($hashes | Where-Object { $_.Path -like "*LocalTelemetry-win-x64.zip" }).Hash
                  "SETUP_HASH=$setupHash" | Out-File -FilePath $env:GITHUB_ENV -Append
                  "ZIP_HASH=$zipHash" | Out-File -FilePath $env:GITHUB_ENV -Append

            - name: Generate Build Artifact Attestations
              uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
              with:
                  subject-path: |
                      ${{ github.workspace }}/LocalTelemetrySetup.exe
                      ${{ github.workspace }}/LocalTelemetry-win-x64.zip
                  show-summary: true

            - name: Install git-cliff
              uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2
              with:
                  tool: git-cliff

            - name: Generate Release Notes
              env:
                  GITHUB_TOKEN: ${{ steps.app_token.outputs.token }}
              run: git-cliff --config cliff.toml --latest --strip header -o release-body.md

            - name: Import GPG Private Key
              uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
              with:
                  gpg_private_key: ${{ secrets.PGP_PRIVATE_KEY }}
                  git_config_global: true
                  git_user_signingkey: true
                  git_tag_gpgsign: true
                  trust_level: 5

            - name: Create & Push GPG-Signed Release Tag
              shell: pwsh
              env:
                  GH_TOKEN: ${{ steps.app_token.outputs.token }}
              run: |
                  $tag = "${{ needs.prepare-release.outputs.new_tag }}"
                  $exists = git ls-remote --tags origin "refs/tags/$tag"
                  if (-not $exists) {
                      git config user.name "protected-auto-commits[bot]"
                      git config user.email "236486036+protected-auto-commits[bot]@users.noreply.github.com"
                      git tag -s -m "Release $tag" "$tag"
                      git push origin "refs/tags/$tag"
                  } else {
                      Write-Host "Tag $tag already exists on origin; skipping creation"
                  }

            - name: Publish GitHub Release
              uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
              with:
                  token: ${{ steps.app_token.outputs.token }}
                  tag_name: ${{ needs.prepare-release.outputs.new_tag }}
                  name: ${{ needs.prepare-release.outputs.new_tag }}
                  body_path: release-body.md
                  prerelease: ${{ contains(needs.prepare-release.outputs.new_version, 'rc') || contains(needs.prepare-release.outputs.new_version, 'beta') || contains(needs.prepare-release.outputs.new_version, 'alpha') }}
                  files: |
                      ./LocalTelemetrySetup.exe
                      ./LocalTelemetry-win-x64.zip
                      ./checksums.txt

            - name: Build & Publish Chocolatey Package
              shell: pwsh
              env:
                  CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
              run: |
                  $ver = "${{ needs.prepare-release.outputs.new_version }}"
                  $tag = "${{ needs.prepare-release.outputs.new_tag }}"
                  $setupHash = $env:SETUP_HASH
                  $setupUrl = "https://github.com/${{ github.repository }}/releases/download/$tag/LocalTelemetrySetup.exe"

                  $nuspec = "packaging/chocolatey/localtelemetry.nuspec"
                  (Get-Content $nuspec -Raw) -replace '<version>.*</version>', "<version>$ver</version>" | Set-Content $nuspec

                  $installScript = "packaging/chocolatey/tools/chocolateyinstall.ps1"
                  (Get-Content $installScript -Raw) `
                      -replace '__URL__', $setupUrl `
                      -replace '__CHECKSUM__', $setupHash | Set-Content $installScript

                  $verificationFile = "packaging/chocolatey/tools/VERIFICATION.txt"
                  if (Test-Path $verificationFile) {
                      (Get-Content $verificationFile -Raw) `
                          -replace '__VERSION__', $ver `
                          -replace '__URL__', $setupUrl `
                          -replace '__CHECKSUM__', $setupHash | Set-Content $verificationFile
                  }

                  choco pack $nuspec --version $ver --outputdirectory packaging/chocolatey
                  if ($env:CHOCOLATEY_API_KEY) {
                      $nupkg = Get-ChildItem -Path "packaging/chocolatey/*.nupkg" | Select-Object -First 1
                      choco push $nupkg.FullName --api-key $env:CHOCOLATEY_API_KEY --source https://push.chocolatey.org/
                      Write-Host "Successfully published Chocolatey package $nupkg"
                  } else {
                      Write-Warning "CHOCOLATEY_API_KEY secret not found; skipping Chocolatey publish."
                  }

            - name: Update & Commit Scoop Manifest
              shell: pwsh
              env:
                  GH_TOKEN: ${{ steps.app_token.outputs.token }}
              run: |
                  $ver = "${{ needs.prepare-release.outputs.new_version }}"
                  $tag = "${{ needs.prepare-release.outputs.new_tag }}"
                  $zipHash = $env:ZIP_HASH
                  $zipUrl = "https://github.com/${{ github.repository }}/releases/download/$tag/LocalTelemetry-win-x64.zip"

                  $manifestFile = "bucket/localtelemetry.json"
                  $manifest = Get-Content $manifestFile -Raw | ConvertFrom-Json
                  $manifest.version = $ver
                  $manifest.architecture.'64bit'.url = $zipUrl
                  $manifest.architecture.'64bit'.hash = $zipHash
                  $manifest | ConvertTo-Json -Depth 10 | Set-Content $manifestFile

                  $manifestContent = [Convert]::ToBase64String([IO.File]::ReadAllBytes("$pwd/$manifestFile"))
                  $sha = $null
                  try {
                      $sha = gh api "repos/${{ github.repository }}/contents/$manifestFile" --jq .sha 2>$null
                  } catch { }

                  $body = @{
                      message = "chore: Update Scoop manifest for $tag [skip ci]"
                      content = $manifestContent
                      branch = "master"
                  }
                  if ($sha) { $body.sha = $sha }
                  $body | ConvertTo-Json | gh api --method PUT "repos/${{ github.repository }}/contents/$manifestFile" --input - --silent
                  Write-Host "Scoop manifest successfully updated and committed"

            - name: Update & Commit CHANGELOG
              shell: pwsh
              env:
                  GH_TOKEN: ${{ steps.app_token.outputs.token }}
              run: |
                  git-cliff --config cliff.toml -o CHANGELOG.md
                  $changedFiles = git diff --name-only -- CHANGELOG.md
                  if ($changedFiles) {
                      $content = [Convert]::ToBase64String([IO.File]::ReadAllBytes("$pwd/CHANGELOG.md"))
                      $sha = gh api "repos/${{ github.repository }}/contents/CHANGELOG.md" --jq .sha
                      $body = @{
                          message = "chore: Update Changelog for ${{ needs.prepare-release.outputs.new_tag }} [skip ci]"
                          content = $content
                          sha = $sha
                          branch = "master"
                      } | ConvertTo-Json
                      $body | gh api --method PUT "repos/${{ github.repository }}/contents/CHANGELOG.md" --input - --silent
                      Write-Host "CHANGELOG successfully updated and committed"
                  } else {
                      Write-Host "No changes in CHANGELOG to commit"
                  }
