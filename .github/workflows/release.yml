name: Release

on:
    push:
        branches: [master]
        paths:
            - ".github/release/**"
            - ".github/workflows/release.yml"
            - "setup.iss"
            - "src/LocalTelemetry.App/**"
            - "src/LocalTelemetry.Core/**"
            - "src/LocalTelemetry.Notifier/**"

permissions:
    contents: read

jobs:
    release:
        name: Release
        runs-on: windows-latest
        permissions:
            contents: write
            id-token: write
            attestations: write
        env:
            DOTNET_CLI_TELEMETRY_OPTOUT: "1"
            DOTNET_NOLOGO: "true"
        steps:
            - name: Generate App Token
              id: app_token
              uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
              with:
                  client-id: ${{ secrets.APP_CLIENT_ID }}
                  private-key: ${{ secrets.APP_PRIVATE_KEY }}

            - name: Checkout Repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  token: ${{ steps.app_token.outputs.token }}
                  fetch-depth: 0

            - name: Fetch All Tags
              run: git fetch --tags --force

            - name: Setup Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

            - name: Setup .NET
              uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
              with:
                  dotnet-version: 10.0.x

            - name: Install Release Dependencies
              run: bun install --frozen-lockfile
              working-directory: .github/release

            - name: Import GPG Key
              id: import_gpg
              uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
              with:
                  gpg_private_key: ${{ secrets.PGP_PRIVATE_KEY }}
                  git_config_global: true
                  git_user_signingkey: true
                  git_tag_gpgsign: true
                  trust_level: 5

            - name: Run Semantic Release
              shell: pwsh
              env:
                  GITHUB_TOKEN: ${{ steps.app_token.outputs.token }}
                  GH_TOKEN: ${{ steps.app_token.outputs.token }}
                  CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
              run: |
                  git config user.name "${{ steps.import_gpg.outputs.name }}"
                  git config user.email "${{ steps.import_gpg.outputs.email }}"
                  bun run ./.github/release/run.ts --extends ./.github/release/release.config.mjs

            - name: Generate Attestations
              if: always() && hashFiles('./LocalTelemetrySetup.exe') != ''
              uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
              with:
                  subject-path: |
                      ${{ github.workspace }}/LocalTelemetrySetup.exe
                      ${{ github.workspace }}/LocalTelemetry-win-x64.zip
                  show-summary: true
