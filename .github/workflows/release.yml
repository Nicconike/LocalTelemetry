name: Release

on:
    push:
        branches: [master]
        paths:
            - ".github/release/**"
            - ".github/workflows/release.yml"
            - "setup.iss"
            - "src/LocalTelemetry.App/**"
            - "src/LocalTelemetry.Core/**"
            - "src/LocalTelemetry.Notifier/**"

permissions:
    contents: read

jobs:
    release:
        name: Release
        runs-on: windows-latest
        permissions:
            contents: write
            id-token: write
            attestations: write
        env:
            DOTNET_CLI_TELEMETRY_OPTOUT: "1"
            DOTNET_NOLOGO: "true"
        steps:
            - name: Generate App Token
              id: app_token
              uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
              with:
                  client-id: ${{ secrets.APP_CLIENT_ID }}
                  private-key: ${{ secrets.APP_PRIVATE_KEY }}

            - name: Checkout Repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  token: ${{ steps.app_token.outputs.token }}
                  fetch-depth: 0

            - name: Setup Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

            - name: Setup .NET
              uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
              with:
                  dotnet-version: 10.0.x

            - name: Install Release Dependencies
              run: bun install --frozen-lockfile
              working-directory: .github/release

            - name: Install Inno Setup 7
              shell: pwsh
              env:
                  GH_TOKEN: ${{ steps.app_token.outputs.token }}
              run: |
                  Write-Host "Querying official JRSoftware releases for latest Inno Setup 7..."
                  $headers = @{ "User-Agent" = "GitHub-Actions-LocalTelemetry-Release" }
                  if ($env:GH_TOKEN) { $headers["Authorization"] = "Bearer $env:GH_TOKEN" }
                  $releases = Invoke-RestMethod -Uri "https://api.github.com/repos/jrsoftware/issrc/releases?per_page=10" -Headers $headers
                  $inno7Release = $releases | Where-Object { (-not $_.prerelease) -and ($_.tag_name -match '^is-7_') } | Select-Object -First 1
                  if (-not $inno7Release) {
                      throw "Could not locate a stable Inno Setup 7 release on jrsoftware/issrc."
                  }
                  $asset = $inno7Release.assets | Where-Object { $_.name -match '^innosetup-7\..*-x64\.exe$' } | Select-Object -First 1
                  if (-not $asset) {
                      throw "Could not locate 64-bit Inno Setup 7 installer asset in release $($inno7Release.tag_name)."
                  }

                  $downloadUrl = $asset.browser_download_url
                  if (-not $downloadUrl.StartsWith("https://github.com/jrsoftware/issrc/releases/download/")) {
                      throw "Insecure download URL detected: $downloadUrl"
                  }

                  $installerPath = Join-Path $env:TEMP "innosetup-7-latest.exe"
                  Write-Host "Downloading $($asset.name) from $downloadUrl..."
                  Invoke-WebRequest -Uri $downloadUrl -OutFile $installerPath

                  Write-Host "Verifying digital Authenticode signature..."
                  $sig = Get-AuthenticodeSignature -FilePath $installerPath
                  if ($sig.Status -ne "Valid") {
                      throw "Cryptographic verification failed: installer signature status is '$($sig.Status)'."
                  }
                  if ($sig.SignerCertificate.Subject -notmatch "Pyrsys B\.V\.") {
                      throw "Untrusted certificate subject '$($sig.SignerCertificate.Subject)'. Expected 'Pyrsys B.V.'."
                  }
                  Write-Host "Signature verified successfully: $($sig.SignerCertificate.Subject)"

                  Write-Host "Installing Inno Setup 7..."
                  $proc = Start-Process -FilePath $installerPath -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-" -Wait -PassThru
                  if ($proc.ExitCode -ne 0) {
                      throw "Inno Setup 7 installer failed with exit code $($proc.ExitCode)."
                  }

                  $isccPath = "C:\Program Files\Inno Setup 7\ISCC.exe"
                  if (-not (Test-Path $isccPath)) {
                      $isccPath = "C:\Program Files (x86)\Inno Setup 7\ISCC.exe"
                  }
                  if (-not (Test-Path $isccPath)) {
                      throw "Inno Setup 7 installation completed but ISCC.exe not found."
                  }
                  Write-Host "Inno Setup 7 installed and verified at: $isccPath"

                  $isccDir = Split-Path $isccPath -Parent
                  "$isccDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

            - name: Run Semantic Release
              shell: pwsh
              env:
                  GH_TOKEN: ${{ steps.app_token.outputs.token }}
              run: |
                  git config user.name "${{ steps.app_token.outputs.app-slug }}[bot]"
                  git config user.email "${{ steps.app_token.outputs.app-slug }}[bot]@users.noreply.github.com"
                  bun run ./.github/release/run.ts --extends ./.github/release/release.config.mjs

            - name: Submit to WinGet Community Repo
              if: env.RELEASE_TAG != ''
              continue-on-error: true
              shell: pwsh
              env:
                  WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
              run: |
                  if ([string]::IsNullOrWhiteSpace($env:RELEASE_TAG)) {
                      Write-Host "No release tag found. Skipping WinGet submission."
                      exit 0
                  }
                  if ([string]::IsNullOrWhiteSpace($env:WINGET_CREATE_GITHUB_TOKEN)) {
                      Write-Host "WINGET_TOKEN is not configured. Skipping WinGet submission."
                      exit 0
                  }
                  $wingetCreatePath = "$env:TEMP\wingetcreate.exe"
                  if (-not (Test-Path $wingetCreatePath)) {
                      Invoke-WebRequest -Uri "https://aka.ms/wingetcreate/latest" -OutFile $wingetCreatePath
                  }
                  & $wingetCreatePath submit packaging/winget/localtelemetry.yaml --prtitle "LocalTelemetry: $env:RELEASE_VERSION" --no-open

            - name: Generate Attestations
              if: success() && hashFiles('./LocalTelemetrySetup.exe') != ''
              uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
              with:
                  subject-path: |
                      ${{ github.workspace }}/LocalTelemetrySetup.exe
                      ${{ github.workspace }}/LocalTelemetry-win-x64.zip
                  show-summary: true
