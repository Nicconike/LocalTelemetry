codecov:
    notify:
        after_n_builds: 4

ignore:
    - "**/*.xaml"
    - "**/obj/**"
    - "**/*.g.cs"

coverage:
    status:
        project:
            default:
                target: auto
                threshold: 1%
                informational: true
                if_ci_failed: error
        patch:
            default:
                target: auto
                threshold: 15%
                informational: true
                if_ci_failed: error

bundle_analysis:
    warning_threshold: "5%"
    status: informational

comment:
    layout: "header, diff, flags, components"
    behavior: default
    require_changes: false
    require_base: false
    require_head: true

flags:
    app:
        paths:
            - src/LocalTelemetry.App/**
        carryforward: true
    core:
        paths:
            - src/LocalTelemetry.Core/**
        carryforward: true
    notifier:
        paths:
            - src/LocalTelemetry.Notifier/**
        carryforward: true

component_management:
    individual_components:
        - component_id: app
          name: App
          paths:
              - src/LocalTelemetry.App/**
        - component_id: core
          name: Core
          paths:
              - src/LocalTelemetry.Core/**
        - component_id: notifier
          name: Notifier
          paths:
              - src/LocalTelemetry.Notifier/**
